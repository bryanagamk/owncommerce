services:
  postgres:
    image: postgres:16-alpine
    container_name: owncommerce-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"   # 5433 di host — hindari bentrok dengan PostgreSQL lokal (5432)
    environment:
      POSTGRES_USER: owncommerce
      POSTGRES_PASSWORD: owncommerce
      POSTGRES_DB: owncommerce
    volumes:
      - owncommerce_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owncommerce -d owncommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: owncommerce-redis
    restart: unless-stopped
    ports:
      - "6380:6379"   # 6380 di host — hindari bentrok dengan Redis lokal (6379)
    volumes:
      - owncommerce_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  owncommerce_postgres_data:
  owncommerce_redis_data:
